name: Offline checks
on: [push, pull_request]
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform android --output-dir dist
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_API_URL: https://api.example.com
          EXPO_PUBLIC_SUPABASE_URL: https://offline-test.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: offline-test-key
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q app
      - run: python -m pytest -q

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morning_brief_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python backend/db_tests/run.py
        env:
          DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/morning_brief_test_ci
